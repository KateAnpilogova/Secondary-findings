<section class="cover">
  <img class="cover-header" src="sups/images/first_page.svg" alt="">
  <div class="cover-title">
    Отчет<br>по результатам исследования генетических вариантов
    <span class="sub">{{ study.report_title }}</span>
  </div>
  <div class="cover-fields">
    <div><span class="k">Участник исследования:</span> {{ patient.participant }}</div>
    <div><span class="k">Пол:</span> {{ patient.sex }}</div>
    <div><span class="k">Дата исследования:</span> {{ patient.date }}</div>
  </div>
</section>
